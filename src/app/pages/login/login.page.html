<ion-content>
  <div class="min-h-screen bg-[#f7f9fb] flex items-center justify-center p-6 font-inter">

    <!-- Background blobs -->
    <div class="fixed top-[-10%] right-[-10%] w-96 h-96 bg-[#1C6E8C]/5 rounded-full blur-[80px] -z-10"></div>
    <div class="fixed bottom-[-5%] left-[-5%] w-72 h-72 bg-[#006c49]/5 rounded-full blur-[60px] -z-10"></div>

    <div class="w-full max-w-md flex flex-col items-center">

      <!-- Logo -->
      <app-montour-header subtitle="Votre concierge digital pour une attente sereine."></app-montour-header>

      <!-- Card -->
      <div class="w-full bg-white rounded-3xl p-8 shadow-[0_20px_50px_rgba(0,63,177,0.05)] border border-[#c3c5d7]/20">
        <header class="mb-8">
          <h2 class="text-2xl font-bold text-[#191c1e] mb-1">Bon retour !</h2>
          <p class="text-[#434654] text-sm">Connectez-vous pour accéder à vos tickets.</p>
        </header>

        <!-- Email -->
        <div class="mb-5">
          <label class="block text-xs font-semibold text-[#434654] uppercase tracking-wider mb-2">Email</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#737686] text-xl">mail</span>
            <input
              type="email"
              placeholder="khalil@montour.sn"
              [(ngModel)]="email"
              class="w-full pl-12 pr-4 py-4 bg-[#e6e8ea] border-none rounded-xl text-[#191c1e] placeholder-[#737686] outline-none focus:ring-2 focus:ring-[#1C6E8C]/20 focus:bg-white transition-all"/>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-6">
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs font-semibold text-[#434654] uppercase tracking-wider">Mot de passe</label>
            <a class="text-xs font-bold text-[#1C6E8C]">Mot de passe oublié ?</a>
          </div>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#737686] text-xl">lock</span>
            <input
              type="password"
              placeholder="••••••••"
              [(ngModel)]="password"
              class="w-full pl-12 pr-4 py-4 bg-[#e6e8ea] border-none rounded-xl text-[#191c1e] placeholder-[#737686] outline-none focus:ring-2 focus:ring-[#1C6E8C]/20 focus:bg-white transition-all"/>
          </div>
        </div>

        <!-- Button -->
        <button
          (click)="login()"
          class="w-full bg-gradient-to-r from-[#1C6E8C] to-[#2a8aad] text-white py-4 rounded-xl text-lg font-bold shadow-lg shadow-[#1C6E8C]/20 active:scale-95 transition-all">
          Se connecter
        </button>

        <!-- Divider -->
        <div class="relative my-6 flex items-center">
          <div class="flex-grow border-t border-[#c3c5d7]/30"></div>
          <span class="mx-4 text-[#434654] text-sm font-medium">ou</span>
          <div class="flex-grow border-t border-[#c3c5d7]/30"></div>
        </div>

        <!-- Google -->
        <button class="w-full flex items-center justify-center gap-3 bg-white border border-[#c3c5d7]/30 text-[#191c1e] py-4 rounded-xl font-semibold hover:bg-[#f2f4f6] active:scale-95 transition-all">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
      </div>

      <!-- Footer -->
      <p class="mt-8 text-[#434654] font-medium">
        Pas encore de compte ?
        <a (click)="goToRegister()" class="text-[#1C6E8C] font-bold ml-1 cursor-pointer">S'inscrire</a>
      </p>

    </div>
  </div>
</ion-content>
